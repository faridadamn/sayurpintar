name: Materialize Mobile Fixes

on:
  push:
    branches: [fix/audit-backlog-vps-neon]
    paths:
      - '.github/workflows/materialize-mobile-fixes.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-backlog-vps-neon
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true
      - name: Apply validated fixes
        run: python3 scripts/apply_mobile_compile_fixes.py
      - name: Format source
        working-directory: mobile
        run: dart format lib
      - name: Remove runtime patching from CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          block = """      - name: Apply deterministic compile fixes
        run: python3 scripts/apply_mobile_compile_fixes.py
      - name: Format generated fixes
        working-directory: mobile
        run: dart format lib
      - name: Upload generated mobile fixes
        uses: actions/upload-artifact@v4
        with:
          name: mobile-compile-fixes
          path: mobile/lib
"""
          if block not in text:
              raise SystemExit('runtime mobile patch block not found in CI')
          path.write_text(text.replace(block, '', 1))
          PY
      - name: Remove one-time tooling
        run: git rm scripts/apply_mobile_compile_fixes.py .github/workflows/materialize-mobile-fixes.yml
      - name: Verify source
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
      - name: Commit permanent source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib .github/workflows/ci.yml
          git commit -m 'fix(mobile): materialize compile fixes in source'
          git push origin HEAD:fix/audit-backlog-vps-neon
