name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Migrate and deploy to VPS
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate required production secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in DATABASE_URL VPS_HOST VPS_USER VPS_SSH_KEY GHCR_USERNAME GHCR_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production secret: $name" >&2
              exit 1
            fi
          done
          case "$DATABASE_URL" in
            *sslmode=require*) ;;
            *) echo "DATABASE_URL must enforce sslmode=require" >&2; exit 1 ;;
          esac

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run fail-fast Neon migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/migrate.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          port="${VPS_PORT:-22}"
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload production compose file
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -Eeuo pipefail
          port="${VPS_PORT:-22}"
          app_dir="${VPS_APP_DIR:-/opt/sayurpintar}"
          ssh -p "$port" "$VPS_USER@$VPS_HOST" "mkdir -p '$app_dir'"
          scp -P "$port" deploy/docker-compose.vps.yml "$VPS_USER@$VPS_HOST:$app_dir/docker-compose.yml"

      - name: Deploy immutable image
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          port="${VPS_PORT:-22}"
          app_dir="${VPS_APP_DIR:-/opt/sayurpintar}"
          printf '%s' "$GHCR_TOKEN" | ssh -p "$port" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          ssh -p "$port" "$VPS_USER@$VPS_HOST" \
            "cd '$app_dir' && test -f .env.production && API_IMAGE='$API_IMAGE' docker compose pull && API_IMAGE='$API_IMAGE' docker compose up -d --remove-orphans"

      - name: Verify deployment health
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -Eeuo pipefail
          port="${VPS_PORT:-22}"
          app_dir="${VPS_APP_DIR:-/opt/sayurpintar}"
          ssh -p "$port" "$VPS_USER@$VPS_HOST" \
            "cd '$app_dir' && for i in \$(seq 1 12); do if curl -fsS http://127.0.0.1:8080/ready >/dev/null; then exit 0; fi; sleep 5; done; docker compose ps; docker compose logs --tail=100 api; exit 1"
