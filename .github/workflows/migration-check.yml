name: Migration Check

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    name: PostgreSQL migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: sayurpintar_migration_test
          POSTGRES_USER: sp_migrate
          POSTGRES_PASSWORD: migration_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sp_migrate:migration_test_password@localhost:5432/sayurpintar_migration_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Validate runner syntax
        run: bash -n scripts/migrate.sh
      - name: Apply migrations
        run: bash scripts/migrate.sh
      - name: Re-run migrations
        run: bash scripts/migrate.sh
      - name: Verify migration state
        shell: bash
        run: |
          set -Eeuo pipefail
          applied="$(psql "$DATABASE_URL" -Atc "SELECT COUNT(*) FROM schema_migrations")"
          tables="$(psql "$DATABASE_URL" -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('users','orders','transactions')")"
          extensions="$(psql "$DATABASE_URL" -Atc "SELECT COUNT(*) FROM pg_extension WHERE extname IN ('pgcrypto','postgis')")"
          test "$applied" = "1"
          test "$tables" = "3"
          test "$extensions" = "2"
