name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.22.3'

jobs:
  normalize:
    name: Normalize source fixes
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Apply targeted source normalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          payment = Path('backend/internal/services/payment_service.go')
          text = payment.read_text()
          old = '''\tif httpResp.StatusCode < 200 || httpResp.StatusCode >= 300 {\n\t\treturn nil, fmt.Errorf("midtrans error (status %d): %s", httpResp.StatusCode, string(respBody))\n\t\tvar errResp struct {\n\t\t\tMessage string `json:"error_message"`\n\t\t}\n\t\tjson.Unmarshal(respBody, &errResp)\n\t\tif errResp.Message != "" {\n\t\t\treturn nil, fmt.Errorf("midtrans: %s", errResp.Message)\n\t\t}\n\t\treturn nil, fmt.Errorf("midtrans returned status %d", httpResp.StatusCode)\n\t}\n'''
          new = '''\tif httpResp.StatusCode < 200 || httpResp.StatusCode >= 300 {\n\t\tvar errResp struct {\n\t\t\tMessage string `json:"error_message"`\n\t\t}\n\t\t_ = json.Unmarshal(respBody, &errResp)\n\t\tif errResp.Message != "" {\n\t\t\treturn nil, fmt.Errorf("midtrans: %s", errResp.Message)\n\t\t}\n\t\treturn nil, fmt.Errorf("midtrans error (status %d): %s", httpResp.StatusCode, string(respBody))\n\t}\n'''
          if old not in text:
              raise SystemExit('target Midtrans block not found')
          payment.write_text(text.replace(old, new, 1))
          PY
          cd mobile
          dart format lib/app/router.dart lib/features/subscription/data/app_subscription_repository.dart
          cd ..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/internal/services/payment_service.go mobile/lib/app/router.dart mobile/lib/features/subscription/data/app_subscription_repository.dart
          if ! git diff --cached --quiet; then
            git commit -m "fix: normalize payment and subscription sources"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

  backend:
    name: Backend checks (Go)
    runs-on: ubuntu-latest
    needs: [normalize]
    if: always() && (needs.normalize.result == 'success' || needs.normalize.result == 'skipped')
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: sayurpintar_test
          POSTGRES_USER: sp_test
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Regenerate dependency checksums
        working-directory: backend
        run: |
          rm -f go.sum
          go mod tidy
      - name: Run backend checks
        id: checks
        working-directory: backend
        shell: bash
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: sayurpintar_test
          POSTGRES_USER: sp_test
          POSTGRES_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          set +e
          status=0
          go vet ./... > vet.log 2>&1
          vet_status=$?
          test "$vet_status" -eq 0 || status=1
          go build ./... > build.log 2>&1
          build_status=$?
          test "$build_status" -eq 0 || status=1
          go test ./... -race -coverprofile=coverage.out > test.log 2>&1
          test_status=$?
          test "$test_status" -eq 0 || status=1
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files" > format.log
            format_status=1
            status=1
          else
            : > format.log
            format_status=0
          fi
          {
            echo "vet_status=$vet_status"
            echo "build_status=$build_status"
            echo "test_status=$test_status"
            echo "format_status=$format_status"
          } >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend/vet.log
            backend/build.log
            backend/test.log
            backend/format.log
            backend/go.sum
          if-no-files-found: ignore
      - name: Upload coverage
        if: always() && hashFiles('backend/coverage.out') != ''
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.out
          fail_ci_if_error: false
      - name: Enforce backend quality gate
        shell: bash
        run: |
          test "${{ steps.checks.outputs.vet_status }}" = 0
          test "${{ steps.checks.outputs.build_status }}" = 0
          test "${{ steps.checks.outputs.test_status }}" = 0
          test "${{ steps.checks.outputs.format_status }}" = 0

  mobile:
    name: Mobile checks (Flutter)
    runs-on: ubuntu-latest
    needs: [normalize]
    if: always() && (needs.normalize.result == 'success' || needs.normalize.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Run mobile checks
        id: checks
        working-directory: mobile
        shell: bash
        run: |
          set +e
          status=0
          flutter analyze > analyze.log 2>&1
          analyze_status=$?
          test "$analyze_status" -eq 0 || status=1
          flutter test --coverage > test.log 2>&1
          test_status=$?
          test "$test_status" -eq 0 || status=1
          dart format --output=none --set-exit-if-changed lib test > format.log 2>&1
          format_status=$?
          test "$format_status" -eq 0 || status=1
          {
            echo "analyze_status=$analyze_status"
            echo "test_status=$test_status"
            echo "format_status=$format_status"
          } >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload mobile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-diagnostics
          path: |
            mobile/analyze.log
            mobile/test.log
            mobile/format.log
          if-no-files-found: ignore
      - name: Enforce mobile quality gate
        shell: bash
        run: |
          test "${{ steps.checks.outputs.analyze_status }}" = 0
          test "${{ steps.checks.outputs.test_status }}" = 0
          test "${{ steps.checks.outputs.format_status }}" = 0

  docker:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sayurpintar-api:${{ github.sha }} backend/
