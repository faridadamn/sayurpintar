name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.22.3'

jobs:
  backend:
    name: Backend checks (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: sayurpintar_test
          POSTGRES_USER: sp_test
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generate dependency checksums
        working-directory: backend
        run: go mod tidy
      - name: Upload generated go.sum
        uses: actions/upload-artifact@v4
        with:
          name: backend-go-sum
          path: backend/go.sum
          if-no-files-found: error
      - name: Report formatting
        continue-on-error: true
        working-directory: backend
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Go files requiring gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Vet diagnostics
        continue-on-error: true
        working-directory: backend
        run: go vet ./... 2>&1 | tee vet.log
      - name: Build
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          go build ./... 2>&1 | tee build.log
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend/vet.log
            backend/build.log
          if-no-files-found: ignore
      - name: Test
        working-directory: backend
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: sayurpintar_test
          POSTGRES_USER: sp_test
          POSTGRES_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: go test ./... -race -coverprofile=coverage.out
      - name: Upload coverage
        if: always() && hashFiles('backend/coverage.out') != ''
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.out
          fail_ci_if_error: false

  mobile:
    name: Mobile checks (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Report formatting
        continue-on-error: true
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze diagnostics
        continue-on-error: true
        working-directory: mobile
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
      - name: Upload mobile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-diagnostics
          path: mobile/analyze.log
          if-no-files-found: ignore
      - name: Test
        working-directory: mobile
        run: flutter test --coverage

  docker:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sayurpintar-api:${{ github.sha }} backend/
