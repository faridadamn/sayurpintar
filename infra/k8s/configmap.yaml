apiVersion: v1
kind: ConfigMap
metadata:
  name: sayurpintar-api-config
  namespace: sayurpintar
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "sayurpintar"
  POSTGRES_SSLMODE: "disable"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  MONGO_HOST: "mongodb-service"
  MONGO_PORT: "27017"
  MONGO_DB: "sayurpintar"
  MEILI_HOST: "http://meilisearch-service:7700"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  APP_ENV: "production"
  CORS_ALLOWED_ORIGINS: "https://sayurpintar.com"
