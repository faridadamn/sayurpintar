apiVersion: apps/v1
kind: Deployment
metadata:
  name: sayurpintar-api
  namespace: sayurpintar
  labels:
    app: sayurpintar-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sayurpintar-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sayurpintar-api
    spec:
      containers:
        - name: api
          image: ghcr.io/sayurpintar/api:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sayurpintar-api-config
            - secretRef:
                name: sayurpintar-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
