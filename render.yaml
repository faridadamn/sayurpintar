services:
  - type: web
    name: sayurpintar-api-staging
    runtime: docker
    plan: free
    region: singapore
    branch: fix/audit-backlog-vps-neon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: neondb
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: POSTGRES_MAX_CONNECTIONS
        value: "10"
      - key: POSTGRES_MIN_CONNECTIONS
        value: "1"
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_DB
        value: "0"
      - key: MONGO_HOST
        sync: false
      - key: MONGO_PORT
        value: "27017"
      - key: MONGO_USER
        sync: false
      - key: MONGO_PASSWORD
        sync: false
      - key: MONGO_DB
        value: sayurpintar_staging
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 168h
      - key: CORS_ALLOWED_ORIGINS
        value: "https://sayurpintar-api-staging.onrender.com"
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: MIDTRANS_ENVIRONMENT
        value: sandbox
      - key: MIDTRANS_SERVER_KEY
        sync: false
      - key: MIDTRANS_CLIENT_KEY
        sync: false
      - key: MIDTRANS_MERCHANT_ID
        sync: false
      - key: MIDTRANS_CALLBACK_URL
        value: https://sayurpintar-api-staging.onrender.com/api/v1/payments/webhook
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
